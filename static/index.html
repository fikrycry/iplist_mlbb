<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IP by Country</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 10% 0%, rgba(13,110,253,0.18), transparent 60%),
        radial-gradient(900px 500px at 90% 20%, rgba(32,201,151,0.18), transparent 55%),
        #0b1020;
      color: #e9eefc;
    }
    .page-wrap { padding-top: 2.25rem; padding-bottom: 3rem; }
    .panel {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }
    .title { letter-spacing: -0.02em; }
    .muted { color: rgba(233,238,252,0.72); }
    .country-card {
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: inherit;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      height: 92px;
    }
    .country-card * { min-width: 0; }
    .country-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.085);
    }
    .country-card:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px rgba(13,110,253,0.35);
    }
    .flag {
      width: 44px;
      height: 32px;
      object-fit: contain;
      border-radius: 8px;
      background: rgba(255,255,255,0.92);
      padding: 2px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      flex: 0 0 auto;
    }
    .search-input {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      color: #e9eefc;
    }
    .search-input:focus {
      background: rgba(255,255,255,0.10);
      border-color: rgba(13,110,253,0.45);
      box-shadow: 0 0 0 4px rgba(13,110,253,0.22);
      color: #e9eefc;
    }
    .search-input::placeholder { color: rgba(233,238,252,0.55); }
    .btn-ghost {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      color: #e9eefc;
    }
    .btn-ghost:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.22);
      color: #ffffff;
    }
    .badge-soft {
      background: rgba(13,110,253,0.18);
      border: 1px solid rgba(13,110,253,0.32);
      color: #cfe2ff;
      font-weight: 600;
    }
    .country-code {
      font-weight: 700;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }
    .country-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .country-count { flex: 0 0 auto; white-space: nowrap; }
  </style>
</head>
<body>
<div class="container page-wrap">
  <div class="panel p-4 p-md-5 mb-4">
    <div class="d-flex flex-column flex-md-row align-items-md-end justify-content-between gap-3">
      <div>
        <h1 class="title mb-1">IP by Country</h1>
        <div class="muted">Pilih negara untuk melihat daftar subnet CIDR.</div>
      </div>
      <div class="text-md-end">
        <div class="muted small">Urut A–Z</div>
        <div id="countriesMeta" class="small"></div>
      </div>
    </div>
    <div class="mt-4">
      <div class="input-group input-group-lg">
        <span class="input-group-text btn-ghost">Cari</span>
        <input id="searchInput" type="search" class="form-control search-input" placeholder="Ketik nama atau kode negara (mis. Indonesia / ID)" autocomplete="off">
        <button id="clearSearch" class="btn btn-ghost" type="button">Reset</button>
      </div>
      <div id="searchHint" class="muted small mt-2"></div>
    </div>
  </div>

  <div id="countriesEmpty" class="alert alert-warning d-none"></div>
  <div id="countries" class="row g-3"></div>
</div>
<script src="main.js"></script>
</body>
</html>
